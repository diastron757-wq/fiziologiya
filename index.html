<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platonus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23c0392b'/><text y='.9em' font-size='80' x='10'>📋</text></svg>" />
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --card: #0f3460;
      --accent: #e94560;
      --accent2: #533483;
      --text: #eaeaea;
      --text-dim: #8892a4;
      --border: #1e3a5f;
      --correct: #27ae60;
      --correct-bg: #0d2b1a;
      --search-bg: #0d1b33;
      --tag-bg: #1e3a5f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* TOP BAR */
    .topbar {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      background: var(--accent);
      color: white;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .subject-label {
      color: var(--text-dim);
      font-size: 13px;
    }
    .stats {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 13px;
      color: var(--text-dim);
    }
    .stats span strong { color: var(--text); }

    /* SEARCH */
    .search-wrap {
      padding: 18px 20px 12px;
      max-width: 900px;
      margin: 0 auto;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--search-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      transition: border-color 0.2s;
    }
    .search-box:focus-within { border-color: var(--accent); }
    .search-box svg { color: var(--text-dim); flex-shrink: 0; }
    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      padding: 12px 10px;
      width: 100%;
    }
    .search-box input::placeholder { color: var(--text-dim); }
    .clear-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      line-height: 1;
      display: none;
    }
    .clear-btn.visible { display: block; }

    /* FILTERS */
    .filters {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--tag-bg);
      border: 1.5px solid var(--border);
      color: var(--text-dim);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .result-count {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 10px;
      font-size: 13px;
      color: var(--text-dim);
    }

    /* QUESTIONS LIST */
    .list {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .q-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .q-card:hover { border-color: var(--accent2); }
    .q-card.answered { border-color: var(--correct); }

    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px 10px;
      cursor: pointer;
      user-select: none;
    }
    .q-num {
      background: var(--card);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      min-width: 36px;
      height: 22px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .q-card.answered .q-num { background: var(--correct); color: white; }
    .q-text {
      flex: 1;
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--text);
    }
    .q-text mark {
      background: rgba(233,69,96,0.25);
      color: var(--accent);
      border-radius: 3px;
      padding: 0 2px;
    }
    .chevron {
      color: var(--text-dim);
      font-size: 18px;
      flex-shrink: 0;
      transition: transform 0.2s;
      margin-top: 1px;
    }
    .q-card.open .chevron { transform: rotate(180deg); }

    .q-answer {
      display: none;
      padding: 0 16px 14px 64px;
    }
    .q-card.open .q-answer { display: block; }
    .answer-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--correct);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .answer-text {
      font-size: 14.5px;
      color: #68d391;
      line-height: 1.5;
    }
    .check-btn {
      margin-top: 12px;
      background: none;
      border: 1.5px solid var(--border);
      color: var(--text-dim);
      border-radius: 7px;
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .check-btn:hover { border-color: var(--correct); color: var(--correct); }
    .q-card.answered .check-btn { border-color: var(--correct); color: var(--correct); }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* RESET */
    .footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 20px;
      text-align: right;
    }
    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 7px;
      padding: 7px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 600px) {
      .q-answer { padding-left: 16px; }
      .stats { display: none; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Platonus</div>
    <span class="subject-label">Возрастная физиология и школьная гигиена</span>
  </div>
  <div class="stats">
    Показано: <strong id="shown">0</strong> &nbsp;|&nbsp;
    Отвечено: <strong id="answered-count">0</strong> / <strong id="total">0</strong>
  </div>
</div>

<div class="search-wrap">

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Поиск по вопросу или ответу..." autocomplete="off" />

<div class="footer">

// State
let answered = new Set(JSON.parse(localStorage.getItem('answered') || '[]'));
let filter = 'all';
let query = '';

function saveAnswered() {
  localStorage.setItem('answered', JSON.stringify([...answered]));
}

function highlight(text, q) {
  if (!q) return text;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function render() {
  const lq = query.toLowerCase();
  let visible = questions.filter(item => {
    const matchQ = item.q.toLowerCase().includes(lq);
    const matchA = item.a.toLowerCase().includes(lq);
    if (!matchQ && !matchA) return false;
    if (filter === 'answered' && !answered.has(item.n)) return false;
    if (filter === 'unanswered' && answered.has(item.n)) return false;
    return true;
  });

  document.getElementById('shown').textContent = visible.length;
  document.getElementById('answered-count').textContent = answered.size;
  document.getElementById('total').textContent = questions.length;
  document.getElementById('result-count').textContent =
    visible.length === questions.length
      ? `Все ${questions.length} вопросов`
      : `Найдено: ${visible.length} из ${questions.length}`;

  const list = document.getElementById('list');

  if (visible.length === 0) {
    list.innerHTML = `<div class="empty"><div class="icon">🔍</div>Ничего не найдено</div>`;
    return;
  }

  // Preserve open state
  const openSet = new Set();
  list.querySelectorAll('.q-card.open').forEach(el => openSet.add(+el.dataset.n));

  list.innerHTML = visible.map(item => {
    const isOpen = openSet.has(item.n);
    const isAnswered = answered.has(item.n);
    const hQ = highlight(item.q, query);
    const hA = highlight(item.a, query);
    return `
    <div class="q-card${isOpen ? ' open' : ''}${isAnswered ? ' answered' : ''}" data-n="${item.n}">
      <div class="q-header">
        <div class="q-num">${item.n}</div>
        <div class="q-text">${hQ}</div>
        <div class="chevron">▾</div>
      </div>
      <div class="q-answer">
        <div class="answer-label">✓ Правильный ответ</div>
        <div class="answer-text">${hA}</div>
        <button class="check-btn" data-n="${item.n}">
          ${isAnswered ? '✓ Отмечено' : 'Отметить как выученный'}
        </button>
      </div>
    </div>`;
  }).join('');

  // Events
  list.querySelectorAll('.q-header').forEach(h => {
    h.addEventListener('click', () => {
      h.closest('.q-card').classList.toggle('open');
    });
  });
  list.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const n = +btn.dataset.n;
      if (answered.has(n)) answered.delete(n);
      else answered.add(n);
      saveAnswered();
      render();
    });
  });
}

// Search
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clear-btn');
searchEl.addEventListener('input', () => {
  query = searchEl.value;
  clearBtn.classList.toggle('visible', !!query);
  render();
});
clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  query = '';
  clearBtn.classList.remove('visible');
  searchEl.focus();
  render();
});

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Сбросить все отметки?')) {
    answered.clear();
    saveAnswered();
    render();
  }
});

render();
</script>
